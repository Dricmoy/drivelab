[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drivelab"
version = "0.1.0"
description = "Local receding-horizon driving simulation and replay API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=2,<3", "pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
ml = ["torch>=2.6,<3"]
waymax = [
  "waymo-waymax @ git+https://github.com/waymo-research/waymax.git@a64dfec9be8576b60d9cecc94f406d9812d4a7d0",
  "numpy==2.0.2", "scipy==1.14.1", "ml-dtypes==0.5.1", "jax==0.4.38", "jaxlib==0.4.38",
  "tensorflow==2.18.1", "chex==0.1.88", "flax==0.10.2", "optax==0.2.4", "orbax-checkpoint==0.11.5",
  "dm-env==1.6", "dm-tree==0.1.9", "immutabledict==4.2.1", "matplotlib==3.9.4",
  "Pillow==11.1.0", "mediapy==1.2.2", "tqdm==4.67.1", "absl-py==2.1.0",
]

[project.scripts]
drivelab = "drivelab.api:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["drivelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["waymax: exercises real optional Waymax dynamics"]
